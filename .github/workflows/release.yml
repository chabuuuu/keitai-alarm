name: Build and Release APK

on:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        id: prepare
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.0.0"
          fi
          
          OUTPUT_DIR="app/build/outputs/apk/release"
          APK_NAME="KeitaiAlarm-${TAG}.apk"
          
          echo "Packaging ${APK_NAME}..."
          cp "${OUTPUT_DIR}/app-release.apk" "${OUTPUT_DIR}/${APK_NAME}"
          
          cd "${OUTPUT_DIR}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          cd -
          
          echo "Generated artifacts in ${OUTPUT_DIR}:"
          ls -la "${OUTPUT_DIR}"

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: KeitaiAlarm-APK
          path: |
            app/build/outputs/apk/release/KeitaiAlarm-*.apk
            app/build/outputs/apk/release/*.sha256
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
          files: |
            app/build/outputs/apk/release/KeitaiAlarm-*.apk
            app/build/outputs/apk/release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
